name: tests

on: [push, pull_request]

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -t .
      - run: python -m pip install build
      - run: python -m build
      - name: Check wheel and source distribution outside the checkout
        shell: bash
        run: |
          for archive in dist/*.whl dist/*.tar.gz; do
            python -m pip install --force-reinstall "$archive"
            (
              cd "$RUNNER_TEMP"
              gearflow --version
              gearflow --help
              gearflow check --help
              gearflow task show --help
              gearflow update --help
              gear-update-upstream --help
              repokeep update --help
              repokeep task show --help
              python -m gearflow --help
              python -m repokeep --help
            )
          done
